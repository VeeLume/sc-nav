[package]
name = "sc-nav-vision"
description = "Image tools for reading HUD panels: ink and shadow feature images, rotation, resampled bands, NCC over a whole image via FFT, peaks"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# Pure on purpose: no capture, no IO, no platform code.
[dependencies]
sc-nav-glyph = { workspace = true }
image = { version = "0.25", default-features = false }
rustfft = "6"

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
