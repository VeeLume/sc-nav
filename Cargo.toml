[workspace]
resolver = "3"
members = [
    "crates/glyph",
    "crates/vision",
    "crates/font",
    "crates/geo",
    "crates/clock",
    "crates/overlay",
    "crates/capture",
    "crates/data",
    "crates/pilot",
    "crates/hud",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/VeeLume/sc-nav"

[workspace.dependencies]
sc-nav-glyph = { path = "crates/glyph", version = "0.1.0" }
sc-nav-vision = { path = "crates/vision", version = "0.1.0" }
sc-nav-font = { path = "crates/font", version = "0.1.0" }
sc-nav-geo = { path = "crates/geo", version = "0.1.0" }
sc-nav-clock = { path = "crates/clock", version = "0.1.0" }
sc-nav-overlay = { path = "crates/overlay", version = "0.1.0" }
sc-nav-capture = { path = "crates/capture", version = "0.1.0" }
sc-nav-data = { path = "crates/data", version = "0.1.0" }
sc-nav-pilot = { path = "crates/pilot", version = "0.1.0" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

[profile.release]
debug = 1

# The glyph matcher is the hot loop: optimise it even in debug builds, so
# tests over recorded sessions stay fast.
[profile.dev.package.sc-nav-glyph]
opt-level = 3
